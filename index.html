<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allan Aminu | Web Designer</title>
<meta name="description" content="Websites, business emails and online growth.">
<meta property="og:title" content="Allan Aminu | Web Designer"><meta property="og:description" content="Websites, business emails and online growth."><meta property="og:image" content="https://abababala.github.io/allan-aminu/images/preview.png"><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#f5c98b;--b1:#0b1226;--b2:#1b2a5a;--g:#ff9f7a;--ov:.55;--bl:0px;--sp:50px;--ga:.08;--gb:18px}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:16px/1.6 Sora,system-ui,sans-serif;color:#eef1fb;background:var(--b1);overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(55% 45% at 12% 8%,var(--g),transparent 62%),radial-gradient(60% 55% at 92% 85%,var(--b2),transparent 70%),var(--b1)}
#bg i,#bg b{position:absolute;inset:0}#bg i{background-size:cover;background-position:center;filter:blur(var(--bl));transform:scale(1.05)}#bg b{background:rgba(8,12,28,var(--ov));display:none}
#app{transition:opacity .9s}body.ld #app{opacity:0}
.g{background:rgba(255,255,255,var(--ga));-webkit-backdrop-filter:blur(var(--gb)) saturate(140%);backdrop-filter:blur(var(--gb)) saturate(140%);border:1px solid rgba(255,255,255,.18);border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.28)}
.t{position:relative;transition:transform .25s;transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0))}
.t::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),transparent 70%);opacity:0;transition:opacity .25s}.t:hover::after{opacity:1}
nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94%,780px);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px 8px 20px;z-index:20;border-radius:999px}
nav .lg{color:#fff;text-decoration:none;font-weight:700}nav .l a{color:#dfe5ff;text-decoration:none;font-size:14px;margin:0 9px}
@media(max-width:760px){nav .l{display:none}}
section,header{max-width:1100px;margin:auto;padding:var(--sp) 6% 6px}footer{max-width:1100px;margin:auto;text-align:center;padding:40px 6% 110px;font-size:14px;opacity:.85}footer a{color:var(--a)}
h1{font-size:clamp(30px,6.5vw,68px);line-height:1.08;letter-spacing:-.02em}h2{font-size:clamp(24px,4vw,34px);margin-bottom:18px;letter-spacing:-.01em}h3{margin:4px 0}
.an{width:fit-content;max-width:92%;margin:84px auto 0;padding:8px 20px;border-radius:999px;font-size:14px;text-align:center}
.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:96px;padding-bottom:10px}.hb+.hero,.an+.hero{padding-top:28px}
.hero>div:first-child{flex:1;min-width:0}.hero p{font-size:clamp(14px,2.2vw,21px);margin:12px 0 22px;max-width:520px;opacity:.9}
.pt{flex:0 0 clamp(105px,26vw,250px);padding:8px;text-align:center;font-size:clamp(10px,1.5vw,13px)}.pt small{display:block;margin-top:8px}
.fr{aspect-ratio:1;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.1);width:100%}.fr picture,.fr img{display:block;width:100%;height:100%;object-fit:cover}.fr>span{display:grid;place-items:center;height:100%;font-size:44px;font-weight:700}
.th.fr{aspect-ratio:16/10;background:linear-gradient(135deg,var(--b2),var(--g))}
.bt{display:inline-block;padding:11px 20px;border-radius:18px;background:var(--a);color:#14182b;font:600 15px Sora,system-ui;text-decoration:none;border:0;cursor:pointer;margin:0 4px 6px 0}.bt.o{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.gr{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.cr{position:relative;overflow:hidden;border-radius:28px}.ct{display:flex;transition:transform .7s cubic-bezier(.22,.8,.25,1)}.sl{flex:0 0 100%;min-width:0}
.cs{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;padding:14px;align-items:center;margin:0 1px}
@media(max-width:760px){.cs{grid-template-columns:1fr;gap:12px}.th.fr{aspect-ratio:4/3}}
.cb{padding:6px 8px 8px}.cb em{font-size:13px;opacity:.75;font-style:normal}.cb p{font-size:15px;opacity:.9}.cb ul{padding-left:18px;margin:10px 0;font-size:14px;opacity:.85}.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}.op{opacity:.7;font-size:13px}
.ar{position:absolute;top:38%;width:42px;height:42px;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:rgba(10,15,35,.45);color:#fff;font-size:24px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.pv{left:10px}.nx{right:10px}
.dt{display:flex;justify-content:center;gap:8px;margin-top:12px}.dt i{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.35);cursor:pointer;transition:.3s}.dt i.on{width:26px;background:var(--a)}
.sv,.st,.qt{padding:20px}.sv p,.qt p{font-size:15px;opacity:.9}.st b{display:grid;place-items:center;width:36px;height:36px;border-radius:14px;background:var(--a);color:#14182b;margin-bottom:8px}
.ab{display:flex;gap:22px;align-items:center;padding:20px;flex-wrap:wrap}.ab .fr{width:150px}.ab p{flex:1;min-width:230px;font-size:18px}
.tm{padding:16px;text-align:center}.tm .fr{width:110px;margin:0 auto 10px}
details{padding:14px 22px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{margin-top:8px;opacity:.9}
.fm{display:grid;gap:12px;padding:22px;max-width:620px}label{display:grid;gap:6px;font-size:14px}
.in{width:100%;padding:13px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font:inherit}.in option{color:#111}
.fl{position:fixed;right:14px;bottom:14px;z-index:25;display:flex;flex-direction:column;gap:12px}.fl img{width:54px;height:54px;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));transition:transform .25s}.fl a:hover img{transform:scale(1.1) translateY(-3px)}
#in{position:fixed;inset:0;z-index:50;background:var(--b1);display:grid;place-content:center;text-align:center;padding:20px;cursor:pointer;transition:opacity .9s,transform .9s}#in.x{opacity:0;transform:translateY(-30px);pointer-events:none}#in p{margin-top:12px;font-size:18px;opacity:.85}
.sk{width:min(86vw,520px);height:90px;border-radius:24px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.14),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-200% 0}}
#m{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.7);display:none;place-items:center;padding:14px}#m.o{display:grid}
.mb{width:min(1000px,100%);padding:14px}.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.mb iframe{width:100%;height:68vh;border:0;border-radius:18px;background:#fff}
.r{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.r.v{opacity:1;transform:none}
.r:not(.v) .gr>*{opacity:0}.v .gr>*{animation:fi .7s both}@keyframes fi{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.r,.r .gr>*{opacity:1!important;transform:none}}
</style></head><body class="ld">
<div id="bg"><i></i><b></b></div><div id="in"><div class="sk"></div></div><div id="app"></div>
<div id="m"><div class="g mb"><div class="mh"><b id="mt"></b><span><a id="ml" class="bt o" target="_blank" rel="noopener">Open site</a> <button class="bt" id="mx">Close</button></span></div><iframe id="mf" title="Site preview"></iframe><p class="op">If the preview stays blank, use Open site.</p></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('content/site.json',{cache:'no-cache'}).then(r=>r.json()).then(go).catch(()=>{$('#app').innerHTML='<p style="padding:100px 6%">Could not load content/site.json</p>';$('#in').remove();document.body.classList.remove('ld')});
function go(d){
const b=d.brand,l=d.look,c=d.contact,S=d.show,a=d.about,ui=d.ui||{},R=document.documentElement.style;
const u=p=>String(p||'').replace(/^\//,''),T=(k,x)=>ui[k]||x,on=x=>x.show!==false,a9=k=>`style="animation-delay:${k*90}ms"`;
document.title=b.title;
R.setProperty('--a',l.accent);R.setProperty('--g',l.glow);R.setProperty('--b1',l.bg1);R.setProperty('--b2',l.bg2);R.setProperty('--ov',l.overlay);R.setProperty('--bl',(l.blur||0)+'px');
R.setProperty('--sp',{compact:'32px',relaxed:'74px'}[ui.spacing]||'50px');
if(ui.glass_blur!=null&&ui.glass_blur!=='')R.setProperty('--gb',ui.glass_blur+'px');if(ui.glass_opacity!=null&&ui.glass_opacity!=='')R.setProperty('--ga',ui.glass_opacity);
if(l.bg_image){$('#bg i').style.backgroundImage='url("'+u(l.bg_image)+'")';$('#bg b').style.display='block'}
const wa=m=>'https://wa.me/'+String(c.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(m||c.wa_message);
const fp=k=>({top:'50% 0%',upper:'50% 20%',bottom:'50% 100%',center:'50% 50%'}[k]||'50% 0%');
const ph=(i,t,f,m)=>i?`<picture>${m?`<source media="(max-width:760px)" srcset="${E(u(m))}">`:''}<img src="${E(u(i))}" alt="${E(t)}" style="object-position:${fp(f)}" loading="lazy"></picture>`:`<span>${E((t||'?')[0])}</span>`;
const W=(id,t,h)=>`<section id="${id}" class="r"><h2>${E(t)}</h2>${h}</section>`;
const ss=(d.sites||[]).filter(on);
const sec={
'Websites':()=>S.sites&&['work','Work',W('work',T('h_sites','Websites I’ve built'),`<div class="cr"><div class="ct">${ss.map(s=>`<div class="sl"><article class="g cs"><div class="th fr">${ph(s.image,s.title,s.focus,s.mobile_image)}</div><div class="cb"><em>${E(s.category)}</em><h3>${E(s.title)}</h3><p>${E(s.desc)}</p>${s.includes&&s.includes.length?`<ul>${s.includes.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:''}<div class="ac">${s.url?`<button class="bt" data-p="${E(s.url)}" data-t="${E(s.title)}">${E(T('lbl_preview','Live preview'))}</button><a class="bt o" href="${E(s.url)}" target="_blank" rel="noopener">${E(T('lbl_visit','Visit site'))}</a>`:'<span class="op">Coming soon</span>'}</div></div></article></div>`).join('')}</div>${ss.length>1&&!ui.hide_arrows?'<button class="ar pv" aria-label="Previous">‹</button><button class="ar nx" aria-label="Next">›</button>':''}</div>${ss.length>1&&!ui.hide_dots?`<div class="dt">${ss.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}`)],
'Services':()=>S.services&&['services','Services',W('services',T('h_services','Services'),`<div class="gr">${d.services.filter(on).map((s,k)=>`<div class="g t sv" ${a9(k)}><h3>${E(s.title)}</h3><p>${E(s.text)}</p></div>`).join('')}</div>`)],
'How it works':()=>S.how&&['how','How',W('how',T('h_how','How it works'),`<div class="gr">${d.how.map((s,k)=>`<div class="g t st" ${a9(k)}><b>${k+1}</b><h3>${E(s.title)}</h3><p>${E(s.text)}</p></div>`).join('')}</div>`)],
'About me':()=>S.about&&['about','About',W('about',T('h_about','About me'),`<div class="g ab"><div class="fr">${ph(a.photo,b.nav_name,a.focus)}</div><p>${E(a.text)}</p></div>`)],
'Team':()=>{const t=(d.team||[]).filter(on);return S.team&&t.length&&['team','Team',W('team',T('h_team','Team'),`<div class="gr">${t.map((m,k)=>`<div class="g t tm" ${a9(k)}><div class="fr">${ph(m.photo,m.name,m.focus)}</div><h3>${E(m.name)}</h3><p class="op">${E(m.title)}</p></div>`).join('')}</div>`)]},
'Testimonials':()=>{const t=(d.testimonials||[]).filter(on);return t.length&&['praise','Praise',W('praise',T('h_testimonials','What clients say'),`<div class="gr">${t.map((m,k)=>`<div class="g t qt" ${a9(k)}><p>“${E(m.quote)}”</p><h3>${E(m.name)}</h3><p class="op">${E(m.role)}</p></div>`).join('')}</div>`)]},
'FAQ':()=>S.faq&&['faq','FAQ',W('faq',T('h_faq','FAQ'),d.faq.filter(on).map(f=>`<details class="g"><summary>${E(f.q)}</summary><p>${E(f.a)}</p></details>`).join(''))],
'Quote form':()=>S.quote&&['quote','Quote',W('quote',T('h_quote','Get a quote'),`<form class="g fm" id="f"><input class="in" name="name" placeholder="Your name" required><input class="in" name="business" placeholder="Business name"><select class="in" name="type"><option value="">Type of business</option>${c.types.map(t=>`<option>${E(t)}</option>`).join('')}</select><textarea class="in" name="need" rows="3" placeholder="What do you need? Website, email, Google listing, social growth"></textarea><input class="in" name="phone" type="tel" placeholder="Phone or WhatsApp number" required><label>Instagram <small class="op">Optional</small><input class="in" name="instagram" placeholder="@yourbusiness"></label><label>Email <small class="op">Optional</small><input class="in" name="email" type="email" placeholder="you@business.com"></label><button class="bt">Send request</button><p id="fr" class="op">${E(c.reply_note)}</p></form>`)]};
const ord=(ui.section_order&&ui.section_order.length?ui.section_order:['Websites','Services','How it works','About me','Team','Testimonials','FAQ','Quote form']);
const P=ord.map(k=>sec[k]&&sec[k]()).filter(Boolean);
const hero=`<header class="hero"><div><h1>${E(b.intro_name)}</h1><p>${E(b.tagline)}</p>${S.quote?`<a class="bt" href="#quote">${E(T('lbl_quote','Get a quote'))}</a>`:''}<a class="bt o" href="${wa()}" target="_blank" rel="noopener">${E(T('lbl_wa','Chat on WhatsApp'))}</a></div><div class="pt g t"><div class="fr">${ph(a.photo,b.nav_name,a.focus||'upper')}</div><small>${E(b.nav_name)}, ${E(b.role)}</small></div></header>`;
const nav=`<nav class="g"><a class="lg" href="#">${E(b.nav_name)}</a><span class="l">${P.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join('')}</span>${S.quote?`<a class="bt" href="#quote">${E(T('lbl_quote','Get a quote'))}</a>`:`<a class="bt" href="${wa()}">WhatsApp</a>`}</nav>`;
const ft=`<footer>Designed by ${E(b.footer_name)}<br><a href="${wa()}" target="_blank" rel="noopener">WhatsApp</a> · <a href="mailto:${E(c.email)}">Email</a>${c.instagram?` · <a href="${E(c.instagram)}" target="_blank" rel="noopener">Instagram</a>`:''}</footer>`;
const fl=(S.floating_whatsapp||!ui.hide_email_icon)?`<div class="fl">${S.floating_whatsapp?`<a href="${wa()}" target="_blank" rel="noopener" aria-label="WhatsApp"><img src="images/whatsapp.png" alt="WhatsApp"></a>`:''}${ui.hide_email_icon?'':`<a href="mailto:${E(c.email)}" aria-label="Email"><img src="images/email.png" alt="Email"></a>`}</div>`:'';
$('#app').innerHTML=nav+(ui.announcement?`<div class="an g">${E(ui.announcement)}</div>`:'')+hero+P.map(x=>x[2]).join('')+ft+fl;
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('v')),{threshold:.06});document.querySelectorAll('.r').forEach(x=>io.observe(x));
// carousel
const C=$('.cr');if(C&&ss.length>1){let i=0,pa=false,sx=0,tm;const N=ss.length,Tr=$('.ct'),dots=[...document.querySelectorAll('.dt i')];
const show=n=>{i=(n+N)%N;Tr.style.transform=`translateX(-${i*100}%)`;dots.forEach((x,k)=>x.classList.toggle('on',k===i))};
const run=()=>{clearInterval(tm);if(!ui.carousel_pause)tm=setInterval(()=>{if(!pa)show(i+1)},(+ui.carousel_seconds||4)*1000)};run();
const pv=$('.pv'),nx=$('.nx');if(pv){pv.onclick=()=>show(i-1);nx.onclick=()=>show(i+1)}dots.forEach((x,k)=>x.onclick=()=>show(k));
C.onmouseenter=()=>pa=true;C.onmouseleave=()=>pa=false;
C.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;pa=true},{passive:true});
C.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)show(i+(dx<0?1:-1));setTimeout(()=>pa=false,8000)})}
// form
const f=$('#f');if(f)f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f)),t=`Hi ${b.nav_name.split(' ')[0]}, I’d like a quote.\nName: ${o.name}\nBusiness: ${o.business}\nType: ${o.type}\nNeed: ${o.need}\nPhone: ${o.phone}`+(o.instagram?`\nInstagram: ${o.instagram}`:'')+(o.email?`\nEmail: ${o.email}`:'');let ok=false;
if(c.formspree){try{ok=(await fetch(c.formspree,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(o)})).ok}catch(x){}}
$('#fr').innerHTML=(ok?'Thanks, your request is in. ':'')+`Send it directly too: <a style="color:var(--a)" href="${wa(t)}" target="_blank" rel="noopener">WhatsApp</a> or <a style="color:var(--a)" href="mailto:${E(c.email)}?subject=${encodeURIComponent('Website quote request')}&body=${encodeURIComponent(t)}">email</a>`};
document.addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p){$('#mt').textContent=p.dataset.t;$('#mf').src=p.dataset.p;$('#ml').href=p.dataset.p;$('#m').classList.add('o')}if(e.target.id==='mx'||e.target.id==='m'){$('#m').classList.remove('o');$('#mf').src='about:blank'}});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const t=e.target.closest('.t');if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;t.style.setProperty('--mx',x*100+'%');t.style.setProperty('--my',y*100+'%');t.style.setProperty('--ry',(x-.5)*7+'deg');t.style.setProperty('--rx',(.5-y)*7+'deg')});
document.addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('.t');if(t&&!t.contains(e.relatedTarget)){t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg')}});
// intro
const I=$('#in'),rd=()=>document.body.classList.remove('ld');
if(S.intro&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const m=ui.intro_bg_mode||'site';
I.style.background=m==='colour'?(ui.intro_bg_color||l.bg1):(m==='photo'&&ui.intro_bg_image)?`linear-gradient(rgba(8,12,28,.55),rgba(8,12,28,.55)),url("${u(ui.intro_bg_image)}") center/cover`:'transparent';
I.innerHTML='<h1 id="tn"></h1><p id="tg"></p>';const end=()=>{I.classList.add('x');rd()};I.onclick=end;
const n=b.intro_name,sp=+ui.typing_speed||95;let k=0;const t=setInterval(()=>{$('#tn').textContent=n.slice(0,++k);if(k>=n.length){clearInterval(t);$('#tg').textContent=b.tagline;setTimeout(end,1300)}},sp)}else{I.remove();rd()}}
</script></body></html>
