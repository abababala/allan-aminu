backend:
  name: github
  repo: abababala/allan-aminu
  branch: main
media_folder: images/uploads
public_folder: images/uploads
collections:
  - name: site
    label: My Website
    files:
      - name: site
        label: Edit everything
        file: content/site.json
        fields:
          - label: "1. Name, intro and tagline"
            name: brand
            widget: object
            collapsed: true
            fields:
              - {label: Intro name, name: intro_name, widget: string, hint: Typed letter by letter when the site opens}
              - {label: Name in the top menu, name: nav_name, widget: string}
              - {label: Your title, name: role, widget: string, hint: Shows under your photo}
              - {label: Tagline, name: tagline, widget: string, hint: Appears under the typed name}
              - {label: Name in the footer, name: footer_name, widget: string}
              - {label: Browser tab title, name: title, widget: string}
          - label: "2. Look and feel"
            name: look
            widget: object
            collapsed: true
            fields:
              - {label: Button colour, name: accent, widget: color}
              - {label: Glow colour, name: glow, widget: color}
              - {label: Background colour 1, name: bg1, widget: color}
              - {label: Background colour 2, name: bg2, widget: color}
              - {label: Background photo, name: bg_image, widget: image, required: false, hint: Optional. Compress under 300 KB first}
              - {label: Photo darkness, name: overlay, widget: number, value_type: float, min: 0, max: 1, step: 0.05, hint: 0 is clear and 1 is fully dark}
              - {label: Photo blur in pixels, name: blur, widget: number, value_type: int, min: 0, max: 30}
          - label: "3. Turn sections on or off"
            name: show
            widget: object
            collapsed: true
            fields:
              - {label: Intro animation, name: intro, widget: boolean}
              - {label: Websites I have built, name: sites, widget: boolean}
              - {label: Services, name: services, widget: boolean}
              - {label: How it works, name: how, widget: boolean}
              - {label: About me, name: about, widget: boolean}
              - {label: Team, name: team, widget: boolean}
              - {label: FAQ, name: faq, widget: boolean}
              - {label: Quote form, name: quote, widget: boolean}
              - {label: Floating WhatsApp button, name: floating_whatsapp, widget: boolean}
          - label: "4. Contact and quote form"
            name: contact
            widget: object
            collapsed: true
            fields:
              - {label: WhatsApp number, name: whatsapp, widget: string, hint: Digits only with country code}
              - {label: Email, name: email, widget: string}
              - {label: Instagram link, name: instagram, widget: string, required: false, hint: Leave empty to hide it}
              - {label: Message prefilled in WhatsApp, name: wa_message, widget: string}
              - {label: Reply time note, name: reply_note, widget: string}
              - {label: Formspree link, name: formspree, widget: string, required: false, hint: Paste your Formspree form link. Empty means visitors send by WhatsApp or email}
              - label: Business types in the form
                name: types
                widget: list
                field: {label: Type, name: type, widget: string}
          - label: "5. Websites I have built"
            name: sites
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - {label: Name, name: title, widget: string}
              - {label: Type of business, name: category, widget: string}
              - {label: Live link, name: url, widget: string, required: false, hint: Empty shows Coming soon}
              - {label: Thumbnail, name: image, widget: image, required: false, hint: Compress under 300 KB}
              - {label: Phone screenshot, name: mobile_image, widget: image, required: false, hint: Optional. Shown on phones instead of the thumbnail}
              - {label: Crop focus, name: focus, widget: select, required: false, default: top, hint: Which part of the image stays visible when it is cropped to fit, options: [{label: Top, value: top}, {label: Upper (good for faces), value: upper}, {label: Centre, value: center}, {label: Bottom, value: bottom}]}
              - {label: Short description, name: desc, widget: text}
              - label: What is included
                name: includes
                widget: list
                required: false
                field: {label: Item, name: item, widget: string}
              - {label: Show on site, name: show, widget: boolean, default: true}
          - label: "6. Services"
            name: services
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - {label: Name, name: title, widget: string}
              - {label: Description, name: text, widget: text}
              - {label: Show on site, name: show, widget: boolean, default: true}
          - label: "7. How it works"
            name: how
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - {label: Step title, name: title, widget: string}
              - {label: Step text, name: text, widget: string}
          - label: "8. About me"
            name: about
            widget: object
            collapsed: true
            fields:
              - {label: Your photo, name: photo, widget: image, required: false, hint: Shows on the homepage and in About}
              - {label: Crop focus, name: focus, widget: select, required: false, default: upper, hint: Which part of the image stays visible when it is cropped to fit, options: [{label: Top, value: top}, {label: Upper (good for faces), value: upper}, {label: Centre, value: center}, {label: Bottom, value: bottom}]}
              - {label: About line, name: text, widget: text}
          - label: "9. Team"
            name: team
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Title, name: title, widget: string}
              - {label: Photo, name: photo, widget: image, required: false}
              - {label: Crop focus, name: focus, widget: select, required: false, default: upper, hint: Which part of the image stays visible when it is cropped to fit, options: [{label: Top, value: top}, {label: Upper (good for faces), value: upper}, {label: Centre, value: center}, {label: Bottom, value: bottom}]}
              - {label: Show on site, name: show, widget: boolean, default: true}
          - label: "10. FAQ"
            name: faq
            widget: list
            collapsed: true
            summary: "{{fields.q}}"
            fields:
              - {label: Question, name: q, widget: string}
              - {label: Answer, name: a, widget: text}
              - {label: Show on site, name: show, widget: boolean, default: true}
          - label: "11. Testimonials"
            name: testimonials
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - {label: Quote, name: quote, widget: text}
              - {label: Name, name: name, widget: string}
              - {label: Role or business, name: role, widget: string, required: false}
              - {label: Show on site, name: show, widget: boolean, default: true}
          - label: "12. Carousel, intro, spacing and extras"
            name: ui
            widget: object
            required: false
            collapsed: true
            fields:
              - {label: Seconds per slide, name: carousel_seconds, widget: number, value_type: int, min: 1, max: 30, required: false, hint: Empty means 4}
              - {label: Stop auto sliding, name: carousel_pause, widget: boolean, required: false}
              - {label: Hide arrows, name: hide_arrows, widget: boolean, required: false}
              - {label: Hide dots, name: hide_dots, widget: boolean, required: false}
              - {label: Intro background, name: intro_bg_mode, widget: select, required: false, default: site, options: [{label: Same as the site, value: site}, {label: Own colour, value: colour}, {label: Own photo, value: photo}]}
              - {label: Intro colour, name: intro_bg_color, widget: color, required: false}
              - {label: Intro photo, name: intro_bg_image, widget: image, required: false}
              - {label: Typing speed in milliseconds per letter, name: typing_speed, widget: number, value_type: int, min: 30, max: 300, required: false, hint: Empty means 95. Smaller is faster}
              - {label: Space between sections, name: spacing, widget: select, required: false, default: normal, options: [{label: Compact, value: compact}, {label: Normal, value: normal}, {label: Relaxed, value: relaxed}]}
              - {label: Glass blur in pixels, name: glass_blur, widget: number, value_type: int, min: 0, max: 40, required: false, hint: Empty means 18}
              - {label: Glass transparency, name: glass_opacity, widget: number, value_type: float, min: 0, max: 0.4, step: 0.02, required: false, hint: Empty means 0.08}
              - {label: Announcement bar text, name: announcement, widget: string, required: false, hint: Leave empty to hide the bar}
              - {label: Hide floating email icon, name: hide_email_icon, widget: boolean, required: false}
              - label: Section order
                name: section_order
                widget: list
                required: false
                hint: Drag to reorder. Sections you leave out are hidden. Empty means the default order
                field: {label: Section, name: s, widget: select, options: [Websites, Services, "How it works", "About me", Team, Testimonials, FAQ, "Quote form"]}
              - {label: Websites heading, name: h_sites, widget: string, required: false, hint: Leave empty to use the default}
              - {label: Services heading, name: h_services, widget: string, required: false}
              - {label: How it works heading, name: h_how, widget: string, required: false}
              - {label: About heading, name: h_about, widget: string, required: false}
              - {label: Team heading, name: h_team, widget: string, required: false}
              - {label: Testimonials heading, name: h_testimonials, widget: string, required: false}
              - {label: FAQ heading, name: h_faq, widget: string, required: false}
              - {label: Quote form heading, name: h_quote, widget: string, required: false}
              - {label: Quote button name, name: lbl_quote, widget: string, required: false}
              - {label: WhatsApp button name, name: lbl_wa, widget: string, required: false}
              - {label: Live preview button name, name: lbl_preview, widget: string, required: false}
              - {label: Visit site button name, name: lbl_visit, widget: string, required: false}
